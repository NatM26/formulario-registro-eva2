<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="animated-bg"></div>

    <div class="floating-hobby hobby-1">🎮</div> 
    <div class="floating-hobby hobby-2">🍽️</div> 
    <div class="floating-hobby hobby-3">💃</div> 
    <div class="floating-hobby hobby-4">⚽</div> 
    <div class="floating-hobby hobby-5">🎨</div> 
    <div class="floating-hobby hobby-6">🎵</div> 

    <main class="container my-5 relative-content">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <div class="card glass-card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        
                        <h2 class="text-center mb-2 fw-bold title-custom">Formulario de Registro</h2>
                        <p class="text-muted text-center mb-4 subtitle-custom">Complete la información requerida en cada sección.</p>
                        <hr class="mb-4 opacity-25">
                        
                        <form id="registroForm" onsubmit="return validar(event)" novalidate>

                            <div class="form-section mb-4">
                                <h5 class="section-title mb-3">1. Datos de Ingreso</h5>
                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label for="username" class="form-label fw-semibold">Nombre de usuario *</label>
                                        <input type="text" class="form-control" id="username" onblur="validarUsername()">
                                        <div id="username-msg" class="form-text"></div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label for="password" class="form-label fw-semibold">Contraseña *</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" id="password" onblur="validarPassword()">
                                            <button class="btn btn-outline-secondary btn-eval" type="button" id="btnTogglePassword" onclick="togglePassword('password', 'btnTogglePassword')">Ver</button>
                                        </div>
                                        <div id="password-msg" class="form-text"></div>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label for="re-password" class="form-label fw-semibold">Confirmar contraseña *</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" id="re-password" onblur="validarConfirmacion()">
                                            <button class="btn btn-outline-secondary btn-eval" type="button" id="btnToggleRePassword" onclick="togglePassword('re-password', 'btnToggleRePassword')">Ver</button>
                                        </div>
                                        <div id="re-password-msg" class="form-text"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section mb-4">
                                <h5 class="section-title mb-3">2. Domicilio y Contacto</h5>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="direccion" class="form-label fw-semibold">Dirección *</label>
                                        <input type="text" class="form-control" id="direccion" onblur="validarDireccion()">
                                        <div id="direccion-msg" class="form-text"></div>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label for="comuna" class="form-label fw-semibold">Comuna *</label>
                                        <select id="comuna" class="form-select" onblur="validarComuna()" onchange="validarComuna()">
                                            <option value="">Seleccione...</option>
                                            <option value="Valdivia">Valdivia</option>
                                            <option value="Corral">Corral</option>
                                            <option value="Lanco">Lanco</option>
                                            <option value="Mariquina">Mariquina</option>
                                            <option value="Máfil">Máfil</option>
                                            <option value="Paillaco">Paillaco</option>
                                            <option value="Los Lagos">Los Lagos</option>
                                            <option value="Panguipulli">Panguipulli</option>
                                        </select>
                                        <div id="comuna-msg" class="form-text"></div>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label for="telefono" class="form-label fw-semibold">Teléfono *</label>
                                        <input type="text" class="form-control" id="telefono" placeholder="Ej: 912345678" onblur="validarTelefono()">
                                        <div id="telefono-msg" class="form-text"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section mb-4">
                                <h5 class="section-title mb-3">3. Enlaces y Aficiones</h5>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="web" class="form-label fw-semibold">Página web personal</label>
                                            <input type="text" class="form-control" id="web" placeholder="https://ejemplo.com" onblur="validarWeb()">
                                            <div id="web-msg" class="form-text"></div>
                                        </div>
                                        <div class="mb-3">
                                            <label for="hobby" class="form-label fw-semibold">Aficiones *</label>
                                            <div class="input-group">
                                                <input type="text" class="form-control" id="hobby" placeholder="Escribe un pasatiempo">
                                                <button type="button" class="btn btn-outline-secondary px-3" onclick="agregar(event)">Agregar</button>
                                            </div>
                                            <div id="hobby-msg" class="form-text"></div>
                                        </div>
                                    </div>
                                    
                                    <div class="col-md-6 mb-3 d-flex flex-column">
                                        <label class="form-label fw-semibold">Aficiones agregadas</label>
                                        <ul class="list-group shadow-sm flex-grow-1" id="hobby-list">
                                            </ul>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-3 justify-content-center border-top pt-4">
                                <button type="submit" class="btn btn-custom-submit px-5 py-2 fw-semibold">Enviar Registro</button>
                                <button type="reset" class="btn btn-custom-reset px-4 py-2 fw-semibold" onclick="limpiarFormulario()">Limpiar</button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
